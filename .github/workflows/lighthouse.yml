name: Lighthouse CI
on: [push]

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Run LHCI
  run: |
    npx @lhci/cli@0.15.x autorun --collect.url=http://localhost:3000 --collect.startServerCommand="npm run start" --collect.numberOfRuns=1