name: Playwright Tests
on:
  push:
    branches: [ master, reports-action]
  pull_request:
    branches: [ master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run Playwright tests
        run: npx playwright test --project=chromium

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Debug report folder
        if: ${{ !cancelled() }}
        run: |
          ls -R playwright-report | head -50
          find . -name "*.html" -not -path "./node_modules/*" -not -path "./.next/*" | head -20
      - name: Prepare report
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: |
          mkdir -p out
          cp -r playwright-report/. out/
          cp out/report.html out/index.html

      - uses: peaceiris/actions-gh-pages@v4
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          destination_dir: playwright
          keep_files: true